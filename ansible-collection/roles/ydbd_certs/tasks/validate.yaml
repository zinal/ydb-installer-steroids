---
- name: Check that ydb_tls_dir is defined
  ansible.builtin.assert:
    that:
      - ydb_tls_dir is defined
      - ydb_tls_dir | length > 0
    fail_msg: >-
      ydb_tls_dir is required and must point to the directory containing
      ca.crt and one subdirectory per inventory hostname.

# Directories keep the inventory hostname intact, including the domain.
# The label before the first dot is not unique across zones, so a short name
# is neither a directory nor an accepted certificate identity.
- name: Use the full inventory hostname for the certificate directory
  ansible.builtin.set_fact:
    ydb_cert_hostname: "{{ inventory_hostname }}"
  changed_when: false

- name: Define the certificate file set
  ansible.builtin.set_fact:
    ydb_cert_files:
      - name: ca.crt
        src: "{{ ydb_tls_dir }}/ca.crt"
        secret: false
      - name: node.crt
        src: "{{ ydb_tls_dir }}/{{ ydb_cert_hostname }}/node.crt"
        secret: false
      - name: node.key
        src: "{{ ydb_tls_dir }}/{{ ydb_cert_hostname }}/node.key"
        secret: true
      - name: web.pem
        src: "{{ ydb_tls_dir }}/{{ ydb_cert_hostname }}/web.pem"
        secret: true
  changed_when: false

- name: Validate the TLS certificate set on the control node
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/files/validate_cert_set.py"
      - --ca
      - "{{ ydb_tls_dir }}/ca.crt"
      - --cert
      - "{{ ydb_tls_dir }}/{{ ydb_cert_hostname }}/node.crt"
      - --key
      - "{{ ydb_tls_dir }}/{{ ydb_cert_hostname }}/node.key"
      - --web
      - "{{ ydb_tls_dir }}/{{ ydb_cert_hostname }}/web.pem"
      - --name
      - "{{ ydb_cert_hostname }}"
      - --label
      - "{{ ydb_cert_hostname }}"
  delegate_to: localhost
  become: false
  changed_when: false
