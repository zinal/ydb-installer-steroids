# runtime.lock — pinned versions for the embedded Ansible control-node runtime.
#
# These values drive scripts/build-runtime.sh, which downloads a relocatable
# CPython (python-build-standalone), installs Ansible into it, copies the
# ydb_platform.ydb collection from a local path, and packs everything into the
# embedded archive.
#
# Bump these intentionally; the archive sha256 (written to runtime.version) acts
# as the cache key, so changes here trigger a re-extract on user machines.

# Target platform (Linux x86_64, glibc). musl/Alpine is intentionally unsupported.
PLATFORM=x86_64-unknown-linux-gnu
#PLATFORM=aarch64-apple-darwin
#PLATFORM=x86_64-pc-windows-msvc

# python-build-standalone release tag and the CPython version it ships.
# See: https://github.com/indygreg/python-build-standalone/releases
PBS_RELEASE=20240814
CPYTHON_VERSION=3.12.5

# Ansible versions (the "ansible" community package pins ansible-core).
ANSIBLE_VERSION=10.3.0
ANSIBLE_CORE_VERSION=2.17.3

# ydb_platform.ydb Ansible collection source.
# The collection is published as a git repository (not on Galaxy), so we
# install it from git via a requirements file. Pin a ref for reproducibility.
COLLECTION_GIT_URL=git+https://github.com/ydb-platform/ydb-ansible
COLLECTION_GIT_REF=main

# Local fallback for the ydb_platform.ydb collection.
#
# Used only when the git URL above is unset or unreachable (e.g. the repository
# is private and no credentials are configured). Point it at a local checkout of
# the collection directory — the one that contains galaxy.yml. Builds that rely
# on this path are NOT reproducible on another machine, so the git URL stays the
# preferred source.
COLLECTION_LOCAL_PATH=../ydb-ansible

# ydb_platform.ydb_em Ansible collection source (YDB Enterprise Manager).
#
# Required by the EM install flow (screen 24), which runs
# ydb_platform.ydb_em.{initial_setup,install_agent,register_agents}.
#
# Unlike ydb_platform.ydb, this collection does NOT live at the repository root:
# it sits under ansible/ydb_platform/ydb_em, hence the #/… subdirectory
# fragment that ansible-galaxy uses to locate it inside the clone.
EM_COLLECTION_GIT_URL=git+https://github.com/ydb-platform/ydb-em#/ansible/ydb_platform/ydb_em
EM_COLLECTION_GIT_REF=main

# Local fallback for the EM collection.
#
# Used only when the git URL above is unset or unreachable (e.g. the repository
# is private and no credentials are configured). Point it at a local checkout of
# the collection directory — the one that contains galaxy.yml. Builds that rely
# on this path are NOT reproducible on another machine, so the git URL stays the
# preferred source.
EM_COLLECTION_PATH=../ydb-em/ansible/ydb_platform/ydb_em

# Extra Python packages required by the bundled collections at runtime.
# ydb_platform.ydb_em declares pyyaml in its requirements.txt; without it the EM
# playbooks fail on the control node.
EXTRA_PYTHON_PACKAGES=pyyaml
